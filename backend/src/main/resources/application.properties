spring.application.name=backend
server.port=${SERVER_PORT:8081}

# Reuse the developer-specific configuration kept at the repository root.
# Values from that ignored file override the safe local defaults below.
spring.config.import=optional:file:../application.properties

# Local MySQL configuration. Override these values with environment variables when needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_ticket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Development-only JWT defaults. Set JWT_SECRET in non-local environments.
jwt.secret=${JWT_SECRET:cinemax-local-development-jwt-secret-key-change-me-2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# VNPay sandbox configuration. Set real sandbox credentials before testing payment.
vnpay.tmnCode=${VNPAY_TMN_CODE:DEMO}
vnpay.hashSecret=${VNPAY_HASH_SECRET:demo-vnpay-hash-secret}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.version=${VNPAY_VERSION:2.1.0}
vnpay.command=${VNPAY_COMMAND:pay}
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8081/api/bookings/vnpay-return}
vnpay.cinemeetReturnUrl=${VNPAY_CINEMEET_RETURN_URL:http://localhost:8081/api/cinemeet/group-bookings/vnpay-return}

# Placeholder values allow local startup without using the upload feature.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo}

app.upload.avatar-dir=${AVATAR_UPLOAD_DIR:uploads/avatars}
